<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songrye Starlight Battle</title>
<meta name="description" content="송례 스타라이트 배틀 — 중학교 3학년 '별과 우주' 탐사 배틀 게임 — 별, 성단, 성운, 은하를 관측하고 추리해 찾아라!">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23070d1c%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2720%27 fill=%27none%27 stroke=%27%2379d3e8%27 stroke-width=%273%27/%3E%3Cpath d=%27M32 6v12M32 46v12M6 32h12M46 32h12%27 stroke=%27%2379d3e8%27 stroke-width=%273%27/%3E%3Cpath d=%27M32 22l3 7 7 3-7 3-3 7-3-7-7-3 7-3z%27 fill=%27%23f3c35a%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 class="logo"><span class="l1">SONGRYE</span><span class="l2">STARLIGHT BATTLE</span></h1><span class="who" id="who"></span></div>
    <div class="hudbar" aria-label="내 탐사 현황">
      <div class="meter score" id="m-pts"><span class="tier" id="tierb">브론즈</span><b id="pts">0</b><span class="pu">P</span><span class="tbar"><i id="tierbar"></i></span></div>
      <div class="meter energy" title="관측 에너지 · 10초마다 1씩 충전">⚡<div class="cells" id="cells"></div> <b id="en">0</b><span class="regen" id="regen"></span></div>
      <div class="meter boost" id="boostb" hidden></div>
      <div class="counts">
      <div class="meter star" id="m-stars" title="별"><svg class="mi" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l2.1 5.9 6.2.2-4.9 3.8 1.7 6-5.1-3.5-5.1 3.5 1.7-6L1.7 7.6l6.2-.2z" fill="#f3c35a"/></svg><b id="stars">0</b></div>
      <div class="meter" id="m-clusters" title="성단"><svg class="mi" viewBox="0 0 20 20" aria-hidden="true"><g fill="#9cc7ff"><circle cx="10" cy="10" r="2.2"/><circle cx="5" cy="7" r="1.4"/><circle cx="14.5" cy="6" r="1.5"/><circle cx="6" cy="14" r="1.3"/><circle cx="14" cy="14.5" r="1.6"/><circle cx="10" cy="4" r="1"/><circle cx="17" cy="10.5" r="1"/><circle cx="3" cy="11" r=".9"/></g></svg><span class="ml">성단</span><b id="clusters">0</b></div>
      <div class="meter" id="m-nebulae" title="성운"><svg class="mi" viewBox="0 0 20 20" aria-hidden="true"><defs><radialGradient id="nbg"><stop offset="0" stop-color="#ffb3c7"/><stop offset="1" stop-color="#ff5d8a" stop-opacity="0"/></radialGradient></defs><ellipse cx="9" cy="10" rx="8" ry="6" fill="url(#nbg)"/><ellipse cx="13" cy="8" rx="5" ry="4" fill="#8f7bff" opacity=".55"/><circle cx="10" cy="10" r="1.3" fill="#fff"/></svg><span class="ml">성운</span><b id="nebulae">0</b></div>
      <div class="meter" id="m-galaxies" title="은하"><svg class="mi" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 10c0-2 2.5-3 4-1.5s.5 5-3 5.5-6-2.5-5.5-6S10 2 13.5 3.5" fill="none" stroke="#c7b8ff" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="10" r="1.8" fill="#fff3d6"/></svg><span class="ml">은하</span><b id="galaxies">0</b></div>
      </div>
    </div>
    <div class="sys">
      <button class="iconb sound" id="snd" aria-pressed="false" title="배경음악"><span class="ic">♪</span><span class="tx" id="sndtx">음악 OFF</span></button>
      <button class="iconb exitb" id="exit" title="처음 화면으로" aria-label="나가기"><span class="ic">⏏</span><span class="tx">나가기</span></button>
    </div>
  </header>

  <nav class="route" id="route" aria-label="원정 경로"></nav>

  <section class="main">
    <div class="skybox">
      <canvas id="sky" tabindex="0" aria-label="관측 하늘. 드래그로 이동, 휠이나 두 손가락으로 확대·축소, 천체를 눌러 망원경 고정"></canvas>
      <div class="hud"><div class="mission" id="hud"></div></div>
      <div class="banner" id="banner" aria-hidden="true"><i class="lb t"></i><i class="lb b"></i><div class="bt"><small id="bsub"></small><b id="btitle"></b></div></div>
      <div class="farcrew" id="farcrew" hidden></div>
      <div class="items" id="items" aria-label="아이템 가방"></div>
      <div class="zoombar">
        <span class="zl" id="zl">×1.0</span>
        <button id="zout" aria-label="축소">−</button>
        <button id="zin" aria-label="확대">+</button>
        <button id="zreset" aria-label="처음 화면으로" style="font-size:15px">⟲</button>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </section>

  <section class="lower">
    <div class="book">
      <h2>탐사 수첩 <span class="muted" style="font-family:var(--f-body);font-size:13px" id="booksec"></span></h2>
      <div class="tbl"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    </div>
    <div class="crew">
      <h2>탐사단 현황 <span class="live off" id="live">OFFLINE</span></h2>
      <div id="crew"></div>
      <ul class="feed" id="feed"></ul>
    </div>
  </section>
  <p class="foot">등급 숫자가 작을수록 밝은 별 · 연주시차 = 1월↔7월 움직인 정도의 ½ · 거리(pc) = 1 ÷ 연주시차(″)</p>
</div>

<div class="ov" id="ov" hidden><div class="card" id="card"></div></div>
<div class="ov ov2" id="ov2" hidden><div class="card" id="card2"></div></div>
<div class="flash" id="flash" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="data.js"></script>
<script src="sky.js"></script>
<script src="net.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
